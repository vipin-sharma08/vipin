:root{--bg:#f6f8f9;--ink:#0f1218;--text:#3a404b;--mute:#6b7280;--rule:#e2e5e9;--lead:#c8ced6;--acc:#2f7fcc;--soon:#7d8591;
  --skyh:clamp(460px,84vh,720px);--top:calc(var(--skyh) * .36);color-scheme:light}
body.night{--bg:#05070d;--ink:#f1f3f7;--text:#c4c9d2;--mute:#8d94a1;--rule:#1a2030;--lead:#2c3446;--acc:#a8f0cc;--soon:#7a8292;color-scheme:dark}
body.monsoon{--bg:#eef1f2;--ink:#10161a;--text:#39434a;--mute:#5f6b73;--rule:#d6dcdf;--lead:#b9c3c8;--acc:#3a7190;--soon:#6c777e}
body.sub{--skyh:clamp(300px,52vh,460px);--top:calc(var(--skyh) * .6)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.75 "Geist",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background-color .9s,color .9s}
#sky{position:absolute;top:0;left:0;width:100%;height:var(--skyh);display:block;z-index:0;opacity:0;transition:opacity 1s,height .6s cubic-bezier(.2,.8,.2,1)}
#sky.on{opacity:1}
#trees{display:block;width:100%;height:clamp(150px,14vw,200px);image-rendering:pixelated}
body.no-gl #sky{opacity:1;background:linear-gradient(#2b7acc,#b3d9f2 40%,transparent 82%)}
body.no-gl.night #sky{background:linear-gradient(#030a26,#0b1a44 40%,transparent 82%)}
#pad{position:absolute;top:0;left:0;right:0;height:var(--top);z-index:3;display:none;touch-action:none;cursor:crosshair}
body.drawing #pad{display:block}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:var(--top) 24px 0;transition:padding .6s cubic-bezier(.2,.8,.2,1)}
a{color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--lead);text-decoration-thickness:1px;text-underline-offset:4px;transition:text-decoration-color .2s,color .2s}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px}
.soon{color:var(--soon);text-decoration:underline dotted var(--lead);text-underline-offset:4px;cursor:help}
.top{display:flex;justify-content:space-between;align-items:center;height:44px}
.mark{font:400 24px/1 "Geist Serif",Georgia,serif;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
#theme{font:400 14px/1 "Geist",sans-serif;color:var(--mute);background:none;border:0;padding:14px 0 14px 14px;cursor:pointer;transition:color .2s}
#theme:hover{color:var(--ink)}
#view{transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
#view.out{opacity:0;transform:translateY(6px)}
.me{display:flex;align-items:center;gap:14px;margin-top:-50px;width:max-content;max-width:calc(100% - 120px)}
body:not(.sub) .mark{visibility:hidden}
#orb{width:46px;height:46px;flex:none;display:block}
.me h1{margin:0;font:400 22px/1.15 "Geist Serif",Georgia,serif;color:var(--ink);letter-spacing:-.005em}
.dt{font-variation-settings:"ELSH" 0;animation:elsh 6s steps(1) infinite}
.dt2{animation-delay:-3s}
@keyframes elsh{0%{font-variation-settings:"ELSH" 0}20%{font-variation-settings:"ELSH" 25}40%{font-variation-settings:"ELSH" 50}60%{font-variation-settings:"ELSH" 75}80%{font-variation-settings:"ELSH" 100}}
.me h1:hover .dt{animation-duration:1.5s}
.tr{display:flex;flex-direction:column;align-items:flex-end;position:relative;z-index:2}
.now{margin:0;font-size:12.5px;line-height:1.3;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.now i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:live 2.4s infinite}
.now b{font-weight:400;animation:blink2 1s steps(1) infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
@keyframes blink2{50%{opacity:.25}}
.role{margin:3px 0 0;font-size:14px;line-height:1.4;color:var(--mute);white-space:nowrap}
.intro{margin-top:36px}
.intro p{margin:0 0 20px;text-wrap:pretty}
#egg{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:2px;vertical-align:-6px;padding:0;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--acc);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#egg:hover{transform:scale(1.18) rotate(-6deg)}
#egg svg{width:18px;height:18px;display:block}
#egg circle{animation:blink 2.8s infinite;animation-delay:calc(var(--i) * .18s)}
@keyframes blink{0%,62%,100%{opacity:1}70%{opacity:.25}}
section{margin-top:44px}
h2{margin:0 0 6px;font:400 14px/24px "Geist",sans-serif;color:var(--mute)}
.rows{list-style:none;margin:0;padding:0}
.rows li+li{margin-top:4px}
.row{display:flex;align-items:center;gap:16px;padding:4px 0;font-size:14px;line-height:24px;font-weight:400;color:var(--text);text-decoration:none}
.row .l{white-space:nowrap;transition:color .2s}
.row .d{color:var(--mute);text-align:right;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.row .lead{flex:1;min-width:24px;height:4px;position:relative;background:radial-gradient(circle,var(--lead) .95px,transparent 1.35px) 0 50%/6px 4px repeat-x}
.row .lead::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--acc) 1.15px,transparent 1.6px) 0 50%/6px 4px repeat-x;clip-path:inset(0 100% 0 0);transition:clip-path .55s cubic-bezier(.2,.8,.2,1)}
a.row:hover .lead::after,a.row:focus-visible .lead::after{clip-path:inset(0 0 0 0)}
a.row:hover .l,a.row:focus-visible .l{color:var(--ink)}
a.row:hover .d,a.row:focus-visible .d{color:var(--text)}
.tag{display:inline-block;margin-left:8px;padding:0 7px;border-radius:99px;font-size:11.5px;line-height:19px;font-weight:500;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);vertical-align:1px}
.back{display:inline-block;font-size:14px;font-weight:400;color:var(--mute);text-decoration:none;margin-top:52px}
.back:hover{color:var(--ink)}
.title{margin:18px 0 0;font:400 clamp(36px,6vw,44px)/1.05 "Geist Serif",Georgia,serif;color:var(--ink);letter-spacing:-.012em}
.lede{margin:14px 0 0;text-wrap:pretty}
.items{list-style:none;margin:0;padding:0}
.items li{padding:12px 0;border-top:1px solid var(--rule)}
.items li:last-child{border-bottom:1px solid var(--rule)}
.items b{font-weight:500;color:var(--ink);font-size:15px}
.items p{margin:2px 0 0;font-size:14px;line-height:1.6;color:var(--mute)}
.fine{margin:12px 0 0;font-size:13px;color:var(--mute)}
.tick{margin:80px 0 0 50%;transform:translateX(-50%);width:100vw}
#tick{display:block;width:100%;cursor:default;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:0;padding:18px 0 28px;font-size:14px;color:var(--mute)}
#hint{position:fixed;z-index:9;top:14px;left:50%;display:flex;gap:10px;align-items:center;padding:5px 5px 5px 14px;border-radius:99px;background:rgba(5,7,13,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#f1f3f7;font-size:13px;line-height:1;box-shadow:0 8px 28px -10px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,-10px);pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
body.drawing #hint{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#done,#clear{height:30px;padding:0 12px;border:0;border-radius:99px;font:500 12.5px/1 "Geist",sans-serif;cursor:pointer}
#done{background:#f1f3f7;color:#05070d}
#clear{background:rgba(255,255,255,.12);color:#f1f3f7}
@media (max-width:600px){
  :root{--skyh:clamp(380px,64vh,520px);--top:calc(var(--skyh) * .49)}
  body.sub{--skyh:clamp(260px,42vh,360px)}
  main{padding-left:20px;padding-right:20px}
  .me{margin-top:-50px}
  .row{flex-direction:column;align-items:flex-start;gap:0;padding:6px 0}
  .row .lead{display:none}
  .row .d{text-align:left;max-width:none;white-space:normal}
  .tick{margin-top:60px;width:100vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="pad" aria-hidden="true"></div>
<div id="hint" role="status">Draw on the sky<button id="clear">Clear</button><button id="done">Done</button></div>
<main>
  <header class="top"><a class="mark" href="#" aria-label="Vipin Sharma, home">Vipin</a><button id="theme"></button></header>
  <div id="view"></div>
  <div class="tick"><canvas id="trees" role="img" aria-label="A line of trees"></canvas><canvas id="tick" aria-hidden="true" style="display:none"></canvas><p class="sr" id="tickText"></p></div>
  <footer><span>© 2026 Vipin Sharma</span><span class="now"><i></i><span id="nowT"></span></span></footer>
</main>
<script>
{
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(pointer: fine)').matches;

/* ---------- content ---------- */
const soon = (t, tip = 'Link coming soon') => `<span class="soon" title="${tip}">${t}</span>`;
const row = (l, d, href, ext) => href
  ? `<li><a class="row" href="${href}"${ext ? ' target="_blank" rel="noopener"' : ''}><span class="l">${l}</span><span class="lead" aria-hidden="true"></span><span class="d">${d}</span></a></li>`
  : `<li><div class="row"><span class="l">${l}</span><span class="lead" aria-hidden="true"></span><span class="d">${d}</span></div></li>`;
const EGG = `<button id="egg" aria-label="Draw on the sky" title="Draw on the sky"><svg viewBox="0 0 18 18" aria-hidden="true">${[0,1,2].map(y => [0,1,2].map(x => `<circle style="--i:${x + y * 3}" cx="${3 + x * 6}" cy="${3 + y * 6}" r="2.1" fill="currentColor"/>`).join('')).join('')}</svg></button>`;

const VIEWS = {
  home: () => `
    <div class="me"><canvas id="orb" aria-hidden="true"></canvas><div><h1>V<span class="dt">i</span>p<span class="dt dt2">i</span>n</h1><p class="role">Founder’s Office, Incentiv</p></div></div>
    <div class="intro">
      <p>Founder’s Office at <a href="https://incentiv.finance" target="_blank" rel="noopener">Incentiv</a>. Open to fintech growth and ops roles.${EGG}</p>
      <p>You can reach me on <a href="https://github.com/vipin-sharma08" target="_blank" rel="noopener">GitHub</a>, ${soon('LinkedIn')}, ${soon('X')} and ${soon('Substack')}.</p>
    </div>
    <section><h2>Notes</h2><ul class="rows">
      ${row('Work', 'What I’ve built at Incentiv', '#work')}
      ${row('Books', 'On the desk right now', '#books')}
      ${row('Thoughts', 'WIRTW and what’s on my mind', '#thoughts')}
      ${row('Music', 'On while I build', '#music')}
    </ul></section>
    <section><h2>Projects</h2><ul class="rows">
      ${row('Funding-leads engine', 'Funding news to a daily lead queue', '#work')}
      ${row('ESOP pool calculator', 'Pool sizing for founders', '#work')}
      ${row('Grant', 'ESOP grant letters for founders', '#work')}
      ${row('India funding map', 'Funded startups, city by city', '#work')}
      ${row('Folio blog pipeline', 'Research to publish, one pipeline', '#work')}
      ${row('SEBI RIA register', 'Clean data on registered advisers', '#work')}
      ${row('MemoAI', 'AI investment memos ↗', 'https://memo-ai-eosin.vercel.app', true)}
    </ul></section>
    <section><h2>Experience</h2><ul class="rows">
      ${row('Incentiv', 'Founder’s Office, 2026')}
      ${row('FLAME University', 'MBA, Finance and Business Analytics, 2026')}
      ${row('WhiteSight', 'Fintech research')}
      ${row('Deccan Nutraceuticals', 'Finance and MIS')}
    </ul></section>`,
  work: () => page('Work', 'At Incentiv I build the machinery behind a small team: data, tools and outbound that run without anyone babysitting them.', `
    <section><h2>Incentiv, since June 2026</h2><ul class="items">
      <li><b>Funding-leads engine</b><span class="tag">Daily</span><p>Sweeps Indian funding news each morning, finds the CEO and finance lead at every newly funded company, and queues them for review.</p></li>
      <li><b>ESOP pool calculator</b><p>A sizing tool for founders on incentiv.finance/tools.</p></li>
      <li><b>Grant</b><p>Founders enter a few inputs and download a ready ESOP grant letter.</p></li>
      <li><b>India funding map</b><p>Click a city to see its funded startups and founders.</p></li>
      <li><b>Folio blog pipeline</b><p>Research, write, audit, design and publish, as one pipeline.</p></li>
      <li><b>SEBI RIA register</b><p>A scraper and clean dataset of registered investment advisers.</p></li>
    </ul></section>
    <section><h2>Side builds</h2><ul class="items">
      <li><b><a href="https://memo-ai-eosin.vercel.app" target="_blank" rel="noopener">MemoAI</a></b><p>An AI investment memo generator on the Claude API and n8n.</p></li>
      <li><b>Adani Green IVM</b><p>An integrated value and ESG workbook.</p></li>
    </ul></section>`),
  books: () => page('Books', 'What’s on the desk right now.', `
    <section><ul class="rows">
      ${row('Superforecasting', 'Philip Tetlock')}
      ${row('Poor Charlie’s Almanack', 'Charles T. Munger')}
      ${row('High Output Management', 'Andrew S. Grove')}
      ${row('The Alchemy of Finance', 'George Soros')}
    </ul><p class="fine">Sample list, to swap for the real one.</p></section>`),
  thoughts: () => page('Thoughts', `I write ${soon('WIRTW')}, a weekly note on markets and AI.`, `
    <section><h2>On my mind</h2><ul class="rows">
      ${row('Prediction markets', 'Thinking in odds')}
      ${row('Indian private markets', 'Funds, founders, ESOPs')}
      ${row('AI and money', 'How decisions get made')}
    </ul></section>
    <section><h2>In the drafts</h2><ul class="rows">${row('Who owns Anthropic isn’t who runs it', 'Draft')}</ul></section>`),
  music: () => page('Music', 'Always on while I build: ambient for deep work, loud for the walk home.', `
    <section><ul class="rows">
      ${row('Kun Faya Kun', 'A. R. Rahman, Javed Ali, Mohit Chauhan')}
      ${row('Intro', 'The xx')}
      ${row('Iktara', 'Amit Trivedi, Kavita Seth')}
      ${row('Nuvole Bianche', 'Ludovico Einaudi')}
      ${row('Midnight City', 'M83')}
    </ul><p class="fine">Sample list, to swap for the real one.</p></section>`)
};
function page(t, lede, body){ return `<a class="back" href="#">↖ Home</a><h1 class="title">${t}</h1><p class="lede">${lede}</p>${body}`; }

/* ---------- time in Bengaluru ---------- */
const ist = () => new Date(Date.now() + 19800000);
const istH = () => { const d = ist(); return d.getUTCHours() + d.getUTCMinutes() / 60; };
const isNight = () => { const h = istH(); return h < 6.1 || h >= 18.5; };
const clock = () => { const d = ist(), h = d.getUTCHours(); return (h % 12 || 12) + ':' + String(d.getUTCMinutes()).padStart(2, '0') + (h < 12 ? 'AM' : 'PM'); };

/* ---------- theme: auto follows Bengaluru; the button names the next one ---------- */
const THEMES = ['auto', 'day', 'night', 'monsoon'];
let pref = 'auto'; try { pref = localStorage.getItem('vs-theme') || 'auto'; } catch (e) {}
if (!THEMES.includes(pref)) pref = 'auto';
const btn = $('#theme'), metaTC = document.querySelector('meta[name=theme-color]');
let theme = 'day';
const W = {day:[1,0,0], night:[0,1,0], monsoon:[0,0,1]};
let wT = [1,0,0], w = [1,0,0];
function applyTheme(snap){
  theme = pref === 'auto' ? (isNight() ? 'night' : 'day') : pref;
  document.body.classList.toggle('night', theme === 'night');
  document.body.classList.toggle('monsoon', theme === 'monsoon');
  const next = THEMES[(THEMES.indexOf(pref) + 1) % THEMES.length];
  btn.textContent = (pref === 'auto' ? 'auto, ' + theme : theme) + ' ↻';
  btn.title = 'Theme: ' + (pref === 'auto' ? 'auto, follows the time in Bengaluru' : pref);
  btn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
  metaTC.content = theme === 'night' ? '#05070d' : theme === 'monsoon' ? '#eef1f2' : '#f6f8f9';
  wT = W[theme]; if (snap || reduce) w = wT.slice();
  tickDirty = true; orbDirty = true; if (reduce) requestFrame(); syncCity();
}
function syncCity(){ const f = document.getElementById('city'); try { if (f && f.contentWindow) f.contentWindow.postMessage({banHour: pref === 'auto' ? null : theme === 'night' ? 22 : theme === 'monsoon' ? 15.5 : 12.5}, '*'); } catch (e) {} }
btn.addEventListener('click', () => { pref = THEMES[(THEMES.indexOf(pref) + 1) % THEMES.length]; try { localStorage.setItem('vs-theme', pref); } catch (e) {} applyTheme(); });
setInterval(() => { if (pref === 'auto') applyTheme(); }, 60000);

/* ---------- router ---------- */
const view = $('#view'), HOME_T = document.title;
let cur = null;
function route(){
  const k = location.hash.slice(1), key = k in VIEWS && k !== 'home' ? k : 'home';
  if (key === cur) return;
  const first = cur === null; cur = key;
  const swap = () => {
    view.innerHTML = VIEWS[key]();
    document.body.classList.toggle('sub', key !== 'home');
    document.title = key === 'home' ? HOME_T : key[0].toUpperCase() + key.slice(1) + ' · Vipin Sharma';
    orbSetup(); bindEgg(); tickNow();
    if (!first) window.scrollTo(0, 0);
    requestAnimationFrame(() => view.classList.remove('out'));
  };
  if (first || reduce) swap(); else { view.classList.add('out'); setTimeout(swap, 220); }
}
window.addEventListener('hashchange', route);

/* ---------- the sky: an LED screen of dots ---------- */
const cv = $('#sky');
let gl = null;
try { gl = cv.getContext('webgl', {alpha:true, premultipliedAlpha:true, antialias:false}); } catch (e) {}
const FS = `precision highp float;
uniform vec2 R,G; uniform float T,C,D,L; uniform vec3 W,M; uniform sampler2D P;
float h1(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h1(i), h1(i + vec2(1., 0.)), f.x), mix(h1(i + vec2(0., 1.)), h1(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * n2(p); p = p * 2.03 + vec2(17.1, 9.2); a *= .5; } return s; }
void main(){
  vec2 px = vec2(gl_FragCoord.x, R.y - gl_FragCoord.y);
  vec2 cell = floor(px / C), lp = (fract(px / C) - .5) * C, cc = (cell + .5) * C;
  float v = cc.y / R.y;
  float fade = 1. - smoothstep(.16, .8, v);
  if (fade < .004){ gl_FragColor = vec4(0.); return; }
  vec2 q = cell / vec2(30., 15.), dr = vec2(T * .06, T * .004);
  float cover = .525 - .075 * W.z + .02 * W.y;
  float f1 = fbm(q + dr), f2 = fbm(q * 2.1 + dr * 1.7 + 5.2);
  float cl = f1 * .8 + f2 * .28;
  float cloud = smoothstep(cover, cover + .13, cl);
  float under = smoothstep(cover - .02, cover + .3, fbm(q + dr + vec2(0., -.09)) * .8 + f2 * .28);
  float g = smoothstep(0., .72, v);
  vec3 sky = W.x * mix(vec3(.17, .48, .8), vec3(.7, .85, .95), g)
           + W.y * mix(vec3(.008, .025, .11), vec3(.05, .1, .27), g)
           + W.z * mix(vec3(.31, .39, .45), vec3(.63, .7, .74), g);
  vec3 cdy = mix(vec3(1.), vec3(.8, .87, .94), (1. - under) * .7);
  vec3 cnt = mix(vec3(.17, .21, .33), vec3(.1, .13, .23), 1. - under);
  vec3 crn = mix(vec3(.88, .9, .92), vec3(.45, .52, .57), (1. - under) * .95);
  vec3 col = mix(sky, W.x * cdy + W.y * cnt + W.z * crn, cloud * (1. - .45 * W.y));
  float hs = h1(cell * 1.31 + 3.7);
  float star = step(.988, hs) * (1. - cloud) * (1. - smoothstep(.25, .7, v));
  float mag = fract(hs * 97.3), tw = .5 + .5 * sin(T * (1.1 + mag * 3.) + mag * 40.);
  col = mix(col, vec3(.93, .97, 1.), star * mix(.22, 1., mag * mag) * (.45 + .55 * tw) * W.y);
  float hc = h1(vec2(cell.x, 7.1));
  float drop = fract(cell.y * .042 - T * (.9 + hc * .8) + hc * 13.);
  col = mix(col, vec3(.93, .97, 1.), step(.42, hc) * smoothstep(.72, 1., drop) * W.z);
  col = mix(col, vec3(1.), L * .5 * (1. - v));
  float md = length(cc - M.xy) / (95. * D);
  col = mix(col, W.x * vec3(1.) + W.y * vec3(.62, .84, 1.) + W.z * vec3(1.), M.z * exp(-md * md * 2.2) * .55);
  float pt = texture2D(P, (cell + .5) / G).a;
  col = mix(col, W.x * vec3(.04, .17, .5) + W.y * vec3(.82, 1., .9) + W.z * vec3(1., .82, .45), pt);
  col *= .975 + .05 * h1(cell + floor(T * 5.));
  float r = C * .39, d = length(lp);
  float dm = 1. - smoothstep(r - D * .8, r + D * .5, d);
  vec3 gut = mix(sky, vec3(1.), .55 * (1. - W.y)) * mix(1., .55, W.y);
  vec3 o = mix(gut, col, dm);
  float a = fade * mix(.32 + .68 * dm, 1., fade * fade);
  gl_FragColor = vec4(o * a, a);
}`;
let prog, U = {}, tex, paint, pctx, grid = [1, 1], C = 7, dpr = 1;
if (gl){
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog); gl.useProgram(prog);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['R', 'G', 'T', 'C', 'D', 'L', 'W', 'M', 'P']) U[n] = gl.getUniformLocation(prog, n);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
    gl.uniform1i(U.P, 0);
    paint = document.createElement('canvas'); pctx = paint.getContext('2d', {willReadFrequently:true});
  } catch (e) { gl = null; console.warn(e); }
}
if (!gl) document.body.classList.add('no-gl');
function size(){
  if (!gl) return;
  dpr = Math.min(devicePixelRatio || 1, 2);
  C = Math.round((innerWidth < 600 ? 6 : 7) * dpr);
  const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
  if (!w || !h) return;
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
  const g = [Math.ceil(w / C), Math.ceil(h / C)];
  if (g[0] !== grid[0] || g[1] !== grid[1]){
    const old = paint.width ? pctx.getImageData(0, 0, paint.width, paint.height) : null;
    grid = g; paint.width = g[0]; paint.height = g[1]; if (old) pctx.putImageData(old, 0, 0); paintDirty = true;
  }
  requestFrame();
}
new ResizeObserver(size).observe(cv);

/* pointer: a soft light follows the cursor across the sky */
let mouse = [-999, -999], mS = 0, mT = 0;
addEventListener('pointermove', e => { if (!fine || drawing) return; mouse = [e.pageX * dpr, e.pageY * dpr]; mT = e.pageY < cv.clientHeight * .78 ? 1 : 0; requestFrame(); }, {passive:true});
document.addEventListener('pointerleave', () => { mT = 0; });

/* easter egg: draw on the sky */
let drawing = false, paintDirty = false, paintLive = 0, last = null;
const pad = $('#pad');
function setDraw(on){
  drawing = on; document.body.classList.toggle('drawing', on); mT = 0;
  if (on) window.scrollTo({top:0, behavior:reduce ? 'auto' : 'smooth'});
  requestFrame();
}
function bindEgg(){ const e = $('#egg'); if (e) e.onclick = () => setDraw(!drawing); }
$('#done').onclick = () => setDraw(false);
$('#clear').onclick = () => { pctx.clearRect(0, 0, paint.width, paint.height); paintDirty = true; requestFrame(); };
addEventListener('keydown', e => { if (e.key === 'Escape' && drawing) setDraw(false); });
const toCell = e => [e.pageX * dpr / C, e.pageY * dpr / C];
function stroke(a, b){
  pctx.strokeStyle = pctx.fillStyle = '#fff'; pctx.lineWidth = 1.5; pctx.lineCap = 'round';
  pctx.beginPath(); pctx.moveTo(a[0], a[1]); pctx.lineTo(b[0], b[1]); pctx.stroke();
  paintDirty = true; paintLive = 1; requestFrame();
}
pad.addEventListener('pointerdown', e => { if (!gl) return; pad.setPointerCapture(e.pointerId); last = toCell(e); stroke(last, [last[0] + .01, last[1]]); });
pad.addEventListener('pointermove', e => { if (!last) return; const p = toCell(e); stroke(last, p); last = p; });
const lift = () => { last = null; };
pad.addEventListener('pointerup', lift); pad.addEventListener('pointercancel', lift);

/* lightning, only in monsoon */
let L = 0, nextBolt = 0;

/* ---------- loop ---------- */
let raf = 0, t0 = performance.now(), visible = true;
const T0 = Math.random() * 400;
function requestFrame(){ if (!raf) raf = requestAnimationFrame(frame); }
function frame(now){
  raf = 0;
  const dt = Math.min(.05, (now - t0) / 1000); t0 = now;
  const k = 1 - Math.exp(-dt * 3.2);
  for (let i = 0; i < 3; i++) w[i] += (wT[i] - w[i]) * k;
  mS += (mT - mS) * (1 - Math.exp(-dt * 6));
  const T = reduce ? T0 : T0 + now / 1000;
  if (theme === 'monsoon' && !reduce){ if (now > nextBolt){ nextBolt = now + 7000 + Math.random() * 12000; L = 1; } L *= Math.exp(-dt * 7); if (L < .02) L = 0; if (L > 0 && Math.random() < .04) L = .8; } else L = 0;
  if (paintLive > 0 && !drawing){ pctx.globalCompositeOperation = 'destination-out'; pctx.fillStyle = 'rgba(0,0,0,.006)'; pctx.fillRect(0, 0, paint.width, paint.height); pctx.globalCompositeOperation = 'source-over'; paintDirty = true; paintLive -= dt / 14; }
  if (gl && visible){
    if (paintDirty){ gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, paint); paintDirty = false; }
    gl.uniform2f(U.R, cv.width, cv.height); gl.uniform2f(U.G, grid[0], grid[1]);
    gl.uniform1f(U.T, T); gl.uniform1f(U.C, C); gl.uniform1f(U.D, dpr); gl.uniform1f(U.L, L);
    gl.uniform3f(U.W, w[0], w[1], w[2]); gl.uniform3f(U.M, mouse[0], mouse[1], mS);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!cv.classList.contains('on')) cv.classList.add('on');
  }
  drawOrb(now); drawTick(now, dt); drawTrees(now);
  if (!reduce) requestFrame();
}
new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) requestFrame(); }).observe(cv);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ t0 = performance.now(); requestFrame(); } });

/* ---------- the orb: a dot-matrix sphere, lit by a slowly turning light ---------- */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
let orb, octx, orbDirty = true, orbT = 0;
function orbSetup(){ orb = $('#orb'); if (!orb) return; const d = Math.min(devicePixelRatio || 1, 2); orb.width = orb.height = Math.round(46 * d); octx = orb.getContext('2d'); orbDirty = true; }
function drawOrb(now){
  if (!orb || !orb.isConnected) return;
  if (!orbDirty && (reduce || now - orbT < 70)) return; orbT = now; orbDirty = false;
  const s = orb.width, cs = Math.max(2, Math.round(s / 15)), r = s / 2 - 1, cx = s / 2, cy = s / 2, a = (reduce ? 0 : now / 4200);
  const lx = Math.cos(a) * .6 - .25, ly = -.55, lz = .58;
  const st = getComputedStyle(document.body), lit = st.getPropertyValue('--acc').trim(), dim = st.getPropertyValue('--lead').trim();
  octx.clearRect(0, 0, s, s);
  for (let y = -r; y < r; y += cs) for (let x = -r; x < r; x += cs){
    const nx = (x + cs / 2) / r, ny = (y + cs / 2) / r, dd = nx * nx + ny * ny; if (dd > 1) continue;
    const nz = Math.sqrt(1 - dd), l = Math.max(0, nx * lx + ny * ly + nz * lz) * .95 + .08;
    const bx = (((x + r) / cs) | 0) & 3, by = (((y + r) / cs) | 0) & 3, on = l > BAYER[by * 4 + bx];
    octx.fillStyle = on ? lit : dim; octx.globalAlpha = on ? 1 : .55;
    octx.beginPath(); octx.arc(cx + x + cs / 2, cy + y + cs / 2, cs * .36, 0, 7); octx.fill();
  }
  octx.globalAlpha = 1;
}

/* ---------- the ticker: a 5x7 LED font, one column at a time ---------- */
const FONT = {
  A:'0E11111F111111', B:'1E11111E11111E', C:'0E11101010110E', D:'1C12111111121C', E:'1F10101E10101F', F:'1F10101E101010',
  G:'0E11101711110F', H:'1111111F111111', I:'0E04040404040E', J:'0702020202120C', K:'11121418141211', L:'1010101010101F',
  M:'111B1515111111', N:'11111915131111', O:'0E11111111110E', P:'1E11111E101010', Q:'0E11111115120D', R:'1E11111E141211',
  S:'0F10100E01011E', T:'1F040404040404', U:'1111111111110E', V:'11111111110A04', W:'1111111515150A', X:'11110A040A1111',
  Y:'11110A04040404', Z:'1F01020408101F', '0':'0E11131519110E', '1':'040C040404040E', '2':'0E11010204081F',
  '3':'1F02040201110E', '4':'02060A121F0202', '5':'1F101E0101110E', '6':'0608101E11110E', '7':'1F010204080808',
  '8':'0E11110E11110E', '9':'0E11110F01020C', ' ':'00000000000000', '.':'00000000000C0C', ',':'000000000C0408', ':':'000C0C000C0C00',
  "'":'0C040800000000', '-':'0000001F000000', '/':'00010204081000', '+':'0004041F040400', '·':'00000004000000'
};
const tick = $('#tick'), tctx = tick.getContext('2d'), ROWS = 11;
let tcols = [], toff = 0, tcell = 6, tw = 0, tickDirty = true, tickSlow = 1, tickSlowT = 1, tickVis = true, lastCol = -1;
const msg = () => `VIPIN SHARMA  ·  FOUNDER'S OFFICE AT INCENTIV  ·  BUILDING WHERE AI MEETS FINANCIAL DECISIONS  ·  OPEN TO FOUNDER'S OFFICE, GROWTH AND OPS ROLES AT FUNDED FINTECHS  ·  BENGALURU ${clock()} IST  ·  `;
function compose(){
  const m = msg(); $('#tickText').textContent = m.replace(/\s+·\s+/g, '. ');
  tcols = [];
  for (const ch of m){
    if (ch === ' '){ tcols.push(0, 0); continue; }
    const hx = FONT[ch] || FONT[' '];
    const rows = []; for (let i = 0; i < 7; i++) rows.push(parseInt(hx.substr(i * 2, 2), 16));
    for (let c = 0; c < 5; c++){ let bits = 0; for (let y = 0; y < 7; y++) if (rows[y] & (16 >> c)) bits |= 1 << y; tcols.push(bits); }
    tcols.push(0);
  }
}
function tickSize(){
  const d = Math.min(devicePixelRatio || 1, 2); tcell = innerWidth < 600 ? 5 : 6;
  tw = tick.clientWidth; tick.style.height = ROWS * tcell + 'px';
  tick.width = Math.round(tw * d); tick.height = Math.round(ROWS * tcell * d); tctx.setTransform(d, 0, 0, d, 0, 0); tickDirty = true; requestFrame();
}
new ResizeObserver(tickSize).observe(tick);
tick.addEventListener('pointerenter', () => { tickSlowT = .2; });
tick.addEventListener('pointerleave', () => { tickSlowT = 1; });
new IntersectionObserver(es => { tickVis = es[0].isIntersecting; if (tickVis) requestFrame(); }).observe(tick);
function drawTick(now, dt){
  if (!tickVis || !tw) return;
  tickSlow += (tickSlowT - tickSlow) * (1 - Math.exp(-dt * 5));
  if (!reduce){ toff += dt * 9 * tickSlow; if (toff >= tcols.length){ toff -= tcols.length; compose(); } }
  const col = Math.floor(toff);
  if (col === lastCol && !tickDirty) return; lastCol = col; tickDirty = false;
  const st = getComputedStyle(document.body), lit = st.getPropertyValue('--acc').trim(), dim = st.getPropertyValue('--lead').trim();
  const n = Math.floor(tw / tcell), ox = (tw - n * tcell) / 2, rad = tcell * .34;
  tctx.clearRect(0, 0, tw, ROWS * tcell);
  for (let x = 0; x < n; x++){
    const bits = tcols[(col + x) % tcols.length] || 0;
    for (let y = 0; y < ROWS; y++){
      const on = y >= 2 && y < 9 && (bits >> (y - 2)) & 1;
      const px = ox + x * tcell + tcell / 2, py = y * tcell + tcell / 2;
      if (on){ tctx.fillStyle = lit; tctx.globalAlpha = .16; tctx.beginPath(); tctx.arc(px, py, tcell * .62, 0, 7); tctx.fill(); tctx.globalAlpha = 1; }
      else { tctx.fillStyle = dim; tctx.globalAlpha = .5; }
      tctx.beginPath(); tctx.arc(px, py, rad, 0, 7); tctx.fill();
    }
  }
  tctx.globalAlpha = 1;
}


/* ---------- footer: a forest edge in pixels, edge to edge ---------- */
const tr = document.getElementById('trees'), tg = tr.getContext('2d');
let TW = 0, TH = 0, TS = 4, trees = [], far = [], tufts = [], rocks = [], trVis = true, trT0 = 0, tImg;
const th = n => { const x = Math.sin(n * 127.1 + 3.3) * 43758.5453; return x - Math.floor(x); };
function treesSize(){
  TS = innerWidth < 600 ? 3 : 4; const cw = tr.clientWidth, ch = tr.clientHeight; if (!cw) return;
  TW = Math.ceil(cw / TS); TH = Math.ceil(ch / TS); tr.width = TW; tr.height = TH; tImg = tg.createImageData(TW, TH);
  const mk = (layer, gap, seed) => { const out = []; let x = -6, i = seed;
    while (x < TW + 8){ const r = th(i), kind = r < .42 ? 'pine' : r < .74 ? 'round' : r < .9 ? 'tall' : 'bush';
      const k = layer === 0 ? .7 : layer === 1 ? .86 : 1;
      const h = (kind === 'pine' ? 18 + th(i + 1) * 16 : kind === 'tall' ? 24 + th(i + 1) * 12 : kind === 'bush' ? 5 + th(i + 1) * 4 : 13 + th(i + 1) * 11) * k * (TH / 50);
      out.push({x: x | 0, h, kind, ph: th(i + 3) * 6, seed: i * 17.3, layer, hue: th(i + 7)});
      x += gap[0] + th(i + 5) * gap[1]; i++; }
    return out; };
  far = mk(0, [3, 4], 500); trees = mk(1, [5, 6], 100).concat(mk(2, [6, 8], 900));
  tufts = Array.from({length: Math.ceil(TW / 2)}, (_, i) => ({x: i * 2 + (th(i + 40) * 2 | 0), h: 1 + (th(i + 41) * 3 | 0), f: th(i + 42)}));
  rocks = Array.from({length: Math.ceil(TW / 60)}, (_, i) => ({x: th(i + 80) * TW | 0, w: 3 + (th(i + 81) * 4 | 0)}));
}
new ResizeObserver(treesSize).observe(tr);
new IntersectionObserver(es => { trVis = es[0].isIntersecting; if (trVis) requestFrame(); }).observe(tr);
const mw3 = (d, n, m) => d.map((v, k) => v * w[0] + n[k] * w[1] + m[k] * w[2]);
const shade = (c, f) => [c[0] * f, c[1] * f, c[2] * f];
function drawTrees(now){
  if (!trVis || !TW || !tImg || now - trT0 < 60) return; trT0 = now;
  const t = reduce ? 0 : now / 1000, D = tImg.data; D.fill(0);
  const set = (x, y, c, a = 1) => { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= TW || y >= TH) return; const o = (y * TW + x) * 4;
    if (a >= 1 || !D[o + 3]){ D[o] = c[0]; D[o + 1] = c[1]; D[o + 2] = c[2]; D[o + 3] = 255 * Math.min(1, a + (D[o + 3] ? 1 : 0)); return; }
    D[o] += (c[0] - D[o]) * a; D[o + 1] += (c[1] - D[o + 1]) * a; D[o + 2] += (c[2] - D[o + 2]) * a; };
  const G = TH - 4;
  const LEAF = [mw3([52, 120, 72], [14, 34, 34], [46, 90, 72]), mw3([74, 140, 84], [20, 44, 44], [62, 104, 86]), mw3([38, 96, 60], [12, 28, 30], [36, 74, 60])];
  const HI = mw3([150, 204, 118], [44, 80, 74], [118, 152, 132]), SH = mw3([22, 62, 44], [6, 14, 18], [24, 48, 42]);
  const FAR = mw3([150, 190, 176], [24, 38, 58], [132, 152, 150]), BARK = mw3([96, 68, 44], [28, 22, 22], [72, 58, 48]), BARK2 = mw3([64, 44, 30], [18, 14, 14], [50, 40, 34]);
  const GRASS = mw3([70, 128, 64], [16, 30, 28], [60, 94, 72]), GRASS2 = mw3([104, 160, 80], [26, 46, 40], [86, 120, 92]), SOIL = mw3([84, 70, 52], [20, 18, 18], [62, 56, 50]);
  const tone = (base, x, y, r, seed) => { /* light from the upper left, with dithered leaf texture */
    const l = (-x * .55 - y * .8) / (r + .01), n = th(x * 3.1 + y * 7.7 + seed);
    if (l + n * .5 > .75) return HI; if (l - n * .4 < -.55) return SH; return n > .7 ? shade(base, 1.08) : base; };
  /* far hazy treeline */
  for (const T of far){ const sway = Math.sin(t * .8 + T.ph) * .6, base = G - 3;
    for (let y = 0; y < T.h; y++){ const u = y / T.h, wdt = T.kind === 'pine' ? (1 - u) * T.h * .3 : Math.sqrt(Math.max(0, 1 - (2 * u - 1) ** 2)) * T.h * .35;
      for (let x = -wdt; x <= wdt; x++) set(T.x + x + sway * u, base - y, FAR, .9); } }
  for (const T of trees){
    const L = T.layer, base = L === 1 ? G - 1 : G, sw = Math.sin(t * 1.15 + T.ph) * (T.h / 18), F = LEAF[(T.hue * 3) | 0], dim = L === 1 ? .82 : 1;
    const col = c => shade(c, dim);
    if (T.kind === 'bush'){ const r = T.h; for (let y = -r; y <= 0; y++) for (let x = -r * 1.6; x <= r * 1.6; x++){ if ((x / 1.6) ** 2 + y * y > r * r * (.8 + th(x + y * 9 + T.seed) * .35)) continue; set(T.x + x, base + y, col(tone(F, x / 1.6, y + r / 2, r, T.seed))); }
      if (w[0] > .5 && th(T.seed) > .5) for (let k = 0; k < 3; k++) set(T.x - r + th(T.seed + k) * 2 * r, base - th(T.seed + k + 3) * r, [236, 120, 150]); continue; }
    const trunkH = T.kind === 'pine' ? 4 : T.kind === 'tall' ? T.h * .45 : T.h * .42;
    for (let y = 0; y < trunkH; y++){ const sx = sw * (y / T.h); set(T.x + sx, base - y, col(BARK)); if (T.h > 16) set(T.x + 1 + sx, base - y, col(BARK2)); }
    set(T.x - 1, base, col(BARK2)); set(T.x + 2, base, col(BARK2));
    if (T.kind === 'pine'){
      const tiers = 3 + (T.h / 10 | 0);
      for (let y = 0; y < T.h; y++){ const u = y / T.h, tier = (u * tiers) % 1, wdt = (1 - u) * T.h * .3 * (.65 + .35 * (1 - tier)) + 1, off = sw * u;
        for (let x = -wdt; x <= wdt; x++){ let c = x < -wdt * .2 ? HI : x > wdt * .35 ? SH : F; if (tier > .82 && Math.abs(x) > wdt - 1.5) c = SH; if (th(x * 5 + y * 3 + T.seed) > .86) c = shade(c, .85);
          set(T.x + x + off, base - 3 - y, col(c)); } }
      set(T.x + sw, base - 4 - T.h, col(HI));
    } else {
      const tall = T.kind === 'tall', r = tall ? T.h * .22 : T.h * .42, cy = base - trunkH - r * (tall ? 1.6 : .7), ry = tall ? 2.1 : 1;
      /* a few branches */
      for (let k = 0; k < 2; k++){ const by = base - trunkH * (.5 + k * .25), dir = k ? 1 : -1; for (let j = 1; j < r * .7; j++) set(T.x + dir * j + sw * .4, by - j * .6, col(BARK)); }
      /* canopy as overlapping clumps */
      const clumps = 4 + (r / 3 | 0);
      for (let c = 0; c < clumps; c++){ const ang = th(T.seed + c) * 6.28, dist = c ? r * .55 * th(T.seed + c + 9) : 0, cr = r * (c ? .5 + th(T.seed + c + 4) * .25 : .75);
        const ccx = Math.cos(ang) * dist, ccy = Math.sin(ang) * dist * ry * .8;
        for (let y = -cr * ry; y <= cr * ry; y++) for (let x = -cr; x <= cr; x++){ const yy = y / ry; if (x * x + yy * yy > cr * cr * (.82 + th(x * 3 + y * 5 + T.seed + c) * .3)) continue;
          const gx = x + ccx, gy = y + ccy, sway = sw * (1 - (gy + r * ry) / (2 * r * ry) * .6);
          set(T.x + gx + sway, cy + gy, col(tone(F, gx, gy / ry, r, T.seed + c))); } }
      /* fruit or blossom dots on some round trees by day */
      if (!tall && th(T.seed + 2) > .7 && w[1] < .5) for (let k = 0; k < 5; k++) set(T.x + (th(T.seed + k * 2) - .5) * r * 1.4 + sw, cy + (th(T.seed + k * 2 + 1) - .5) * r, th(T.seed) > .85 ? [240, 150, 60] : [250, 236, 160]);
    }
  }
  /* ground: soil band, grass tufts, small flowers, rocks */
  for (let y = G + 1; y < TH; y++) for (let x = 0; x < TW; x++) set(x, y, y === G + 1 ? GRASS : th(x * 1.7 + y * 3.1) > .8 ? shade(SOIL, 1.15) : SOIL);
  for (const r of rocks) for (let x = 0; x < r.w; x++){ set(r.x + x, G, mw3([150, 150, 142], [46, 50, 58], [128, 132, 132])); if (x && x < r.w - 1) set(r.x + x, G - 1, mw3([178, 178, 170], [60, 64, 74], [150, 154, 154])); }
  for (const g of tufts){ const bend = Math.round(Math.sin(t * 2 + g.x * .3) * .6);
    for (let y = 0; y < g.h; y++) set(g.x + (y === g.h - 1 ? bend : 0), G - y, y ? GRASS2 : GRASS);
    if (g.f > .93 && w[1] < .5) set(g.x + bend, G - g.h, g.f > .97 ? [250, 220, 70] : g.f > .95 ? [250, 250, 250] : [236, 120, 170]); }
  /* fireflies at night, butterflies by day, rain in monsoon */
  if (w[1] > .05) for (let k = 0; k < Math.ceil(TW / 30); k++){ const fx = (th(k + 300) * TW + Math.sin(t * .5 + k) * 6), fy = G - 3 - th(k + 301) * TH * .45 + Math.sin(t * .9 + k * 2) * 2, b = .5 + .5 * Math.sin(t * (2 + th(k) * 3) + k);
    if (b > .45) set(fx, fy, [210, 255, 140], w[1] * b); }
  if (w[0] > .5) for (let k = 0; k < 3; k++){ const bx = ((t * (3 + k) + k * 120) % (TW + 20)) - 10, by = G - 8 - k * 3 + Math.sin(t * 3 + k) * 2, fl = Math.sin(t * 14 + k) > 0;
    const c = [[250, 200, 60], [240, 240, 250], [120, 170, 250]][k]; set(bx, by, c); if (fl){ set(bx - 1, by - 1, c); set(bx + 1, by - 1, c); } else { set(bx - 1, by, c); set(bx + 1, by, c); } }
  if (w[2] > .05) for (let k = 0; k < TW * .4; k++){ const rx = th(k + 600) * TW, ry = (th(k + 601) * TH + t * (30 + th(k) * 20)) % TH; set(rx, ry, [210, 224, 232], .45 * w[2]); }
  tg.putImageData(tImg, 0, 0);
}


/* live time and day in Bengaluru */
function tickNow(){ const el = document.getElementById('nowT'); if (el){ const d = ist(), h = d.getUTCHours(), m = String(d.getUTCMinutes()).padStart(2, '0');
  const day = ['sun','mon','tue','wed','thu','fri','sat'][d.getUTCDay()];
  el.innerHTML = `bangalore • ${day} • ${h % 12 || 12}<b>:</b>${m} ${h < 12 ? 'am' : 'pm'}`; } }
setInterval(tickNow, 15000);
/* ---------- boot ---------- */
window.__syncCity = syncCity; compose(); applyTheme(true); route(); size(); requestFrame();
}
